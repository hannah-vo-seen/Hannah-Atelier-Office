<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Audiowide&display=swap" rel="stylesheet"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;color:#f3eeff;font-family:Inter,system-ui,sans-serif;background:radial-gradient(420px 500px at 50% 38%,#2c1466 0%,#0c0718 60%,#05030f 100%);position:relative}
.neb{position:absolute;border-radius:50%;filter:blur(50px);opacity:.5}
#stars{position:absolute;inset:0}
.star{position:absolute;border-radius:50%;background:#fff}
.planet{position:absolute;left:50%;top:330px;width:250px;height:250px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 36% 30%,#ffe9b0 0%,#c9a6ff 22%,#5b2ee0 55%,#1a0a4d 85%);box-shadow:0 0 70px 6px #b389ff77,inset -30px -20px 60px #0b0624cc}
.ring{position:absolute;left:50%;top:330px;width:380px;height:100px;transform:translate(-50%,-50%) rotate(-12deg);border-radius:50%;border:1.5px solid #ffd27a88;box-shadow:0 0 14px #ffd27a55}
.top{position:absolute;top:70px;left:0;right:0;text-align:center}
.top small{font:600 11px Orbitron,Audiowide,system-ui,sans-serif;letter-spacing:.3em;color:#cdb8ff;text-transform:uppercase}
.top h1{font:900 38px/1.05 Orbitron,Audiowide,system-ui,sans-serif;letter-spacing:.04em;margin-top:12px;background:linear-gradient(90deg,#ffe7a3,#ff9fe0 38%,#b99cff 68%,#7ad7ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #b389ff88)}
.bottom{position:absolute;left:24px;right:24px;bottom:56px;text-align:center}
.bottom p{font-size:14px;line-height:1.55;color:#d9ccf5;margin-bottom:22px}
.btn{display:block;padding:16px;border-radius:18px;background:linear-gradient(90deg,#7a3fe0,#c2338f 60%,#ff9f43);color:#fff;font:700 16px Inter;box-shadow:0 14px 34px -8px #9b4dffaa;border:1px solid #ffffff44}
.hint{margin-top:14px;font:600 10px ui-monospace,Menlo,monospace;letter-spacing:.18em;color:#9d8ccc;text-transform:uppercase}
.spark{position:absolute;color:#ffe7a3;text-shadow:0 0 10px #ffd27a;font-size:14px}
.greet{min-height:120px;margin-bottom:18px}
.gl{font:800 24px/1.3 Inter,system-ui;opacity:0;transform:translateY(12px);transition:all .6s ease;margin-bottom:8px}
.gl.show{opacity:1;transform:none}
.bar{height:6px;border-radius:9px;background:#ffffff1f;overflow:hidden;margin:0 auto 10px;width:70%}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd27a,#ff9fe0,#b99cff);transition:width 5s linear}
.bar i.go{width:100%}
</style></head><body>
<div class="neb" style="left:-120px;top:-80px;width:340px;height:300px;background:#6a3fe0"></div>
<div class="neb" style="right:-120px;top:420px;width:320px;height:300px;background:#ff7ab0;opacity:.25"></div>
<div id="stars"></div>
<div class="spark" style="left:44px;top:250px">✦</div><div class="spark" style="right:40px;top:200px;font-size:11px">✦</div><div class="spark" style="left:320px;top:520px;font-size:18px">✦</div>
<div class="ring"></div><div class="planet"></div>
<div class="top"><small>✦ Tín hiệu đã kết nối ✦</small><h1>Hannah<br>Atelier Office</h1></div>
<div class="bottom"><div class="greet"><div id="g1" class="gl">Hi Hannah! 👋</div><div id="g3" class="gl">31 agent đã sẵn sàng ạ ✨</div></div><div class="bar"><i id="pb"></i></div><div class="hint" style="margin-top:0">Tự vào sau <span id="cd">5</span>s</div></div>
<script>
const s=document.getElementById('stars');let seed=11;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<120;i++){const d=document.createElement('div');d.className='star';d.style.left=(r()*100)+'%';d.style.top=(r()*100)+'%';const z=r();d.style.width=d.style.height=(z<.85?1.5:3)+'px';d.style.opacity=(0.3+r()*0.7);s.appendChild(d);}

const ids=['g1','g3'];ids.forEach((id,i)=>setTimeout(()=>document.getElementById(id).classList.add('show'),300+i*900));
setTimeout(()=>document.getElementById('pb').classList.add('go'),100);
let n=5;const cd=document.getElementById('cd');const t=setInterval(()=>{n--;cd.textContent=Math.max(n,0);if(n<=0){clearInterval(t);document.body.dataset.done='1';}},1000);
</script></body></html>
